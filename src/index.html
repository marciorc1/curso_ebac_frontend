<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>
<body>
    <main>
        <h1>Calculadora IMC</h1>
        <form id="form-calculadora-imc">
            <div>
                <label for="altura">Digite sua altura</label>
                <input type="number" id="altura" step="any" required>
                <label for="peso">Digite seu peso</label>
                <input type="number" id="peso" step="any" required>
            </div>
            <button type="submit">Calcular</button>
        </form>
        <div class="resultado">
            Seu IMC é: <span id="resultado-valor"></span>
            <span id="condicao"></span>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
