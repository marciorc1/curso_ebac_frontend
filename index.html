<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio_HTML_Js</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="container">
        <h1>Validação de números</h1>
        <form id="form-numeros">    
            <h3>Número A</h3>        
            <input type="number" id="numeroA" placeholder="Insira um valor"/>
            <h3>Número B</h3>
            <input type="number" id="numeroB" placeholder="Insira um valor"/>
            <p class="error-message">
                O valor tem que ser maior que o número A
            </p>
            <button id="btn-submit" type="submit">Validar</button>
        </form>
        <p class="success-message">
    </div>
    <script src="./main.js"></script>
</body>
</html>
